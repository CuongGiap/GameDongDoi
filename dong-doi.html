<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,800;1,400&family=Dancing+Script:wght@600;700&display=swap">

<style>
/* Layout: trang vở ô ly. Bìa vở dán trên cùng (sticky), nội dung trên giấy kẻ ô,
   điểm số và lời phê viết bằng bút mực đỏ của cô giáo. */
:root {
  --paper:       #faf8f1;
  --paper-2:     #f2efe4;
  --grid:        rgba(31, 45, 90, 0.085);
  --ink:         #1f2d5a;
  --ink-soft:    #5f6d92;
  --ink-faint:   #949db8;
  --muc-tim:     #6b4ea8;
  --muc-tim-bg:  rgba(107, 78, 168, 0.1);
  --but-do:      #c2362b;
  --but-do-bg:   rgba(194, 54, 43, 0.1);
  --bang-xanh:   #2f6b4f;
  --bang-bg:     rgba(47, 107, 79, 0.12);
  --vien:        #e2dcc9;
  --vien-dam:    #c9c0a6;
  --shadow:      rgba(31, 45, 90, 0.1);

  --f-display: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body:    "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-viet:    "Dancing Script", "Segoe Script", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #171c2b;
    --paper-2:    #1e2436;
    --grid:       rgba(188, 203, 240, 0.075);
    --ink:        #e7ebf7;
    --ink-soft:   #a3adca;
    --ink-faint:  #6b7493;
    --muc-tim:    #b49ae8;
    --muc-tim-bg: rgba(180, 154, 232, 0.16);
    --but-do:     #f08578;
    --but-do-bg:  rgba(240, 133, 120, 0.16);
    --bang-xanh:  #6fc79a;
    --bang-bg:    rgba(111, 199, 154, 0.15);
    --vien:       #2c3448;
    --vien-dam:   #3d4760;
    --shadow:     rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper:      #171c2b;
  --paper-2:    #1e2436;
  --grid:       rgba(188, 203, 240, 0.075);
  --ink:        #e7ebf7;
  --ink-soft:   #a3adca;
  --ink-faint:  #6b7493;
  --muc-tim:    #b49ae8;
  --muc-tim-bg: rgba(180, 154, 232, 0.16);
  --but-do:     #f08578;
  --but-do-bg:  rgba(240, 133, 120, 0.16);
  --bang-xanh:  #6fc79a;
  --bang-bg:    rgba(111, 199, 154, 0.15);
  --vien:       #2c3448;
  --vien-dam:   #3d4760;
  --shadow:     rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--f-body);
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(to right,  var(--grid) 0 1px, transparent 1px 26px);
  background-attachment: fixed;
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--paper-2);
}

.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}

button { font-family: inherit; font-size: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2.5px solid var(--muc-tim); outline-offset: 2px;
}
h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--f-display); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Bìa vở (header) ---------- */
.bia {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper-2);
  border-bottom: 2px solid var(--vien-dam);
  box-shadow: 0 2px 10px var(--shadow);
  margin-bottom: 20px;
}
.bia-in {
  max-width: 1080px; margin: 0 auto;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
}
.danh { display: flex; align-items: center; gap: 11px; min-width: 0; }
.avatar {
  width: 42px; height: 42px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 21px; line-height: 1;
  background: var(--muc-tim-bg); border: 2px solid var(--muc-tim);
  padding: 0; font-family: inherit; cursor: pointer;
  transition: transform .12s ease;
}
.avatar:hover { transform: scale(1.08); }

/* ---------- Chọn ngoại hình ---------- */
.av-luoi {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));
  gap: 6px;
}
.av-o {
  aspect-ratio: 1; display: grid; place-items: center;
  font-size: 23px; line-height: 1; padding: 0;
  border: 1.5px solid var(--vien-dam); border-radius: 3px;
  background: var(--paper); color: var(--ink);
  transition: transform .12s ease, border-color .14s ease;
}
.av-o:hover { transform: scale(1.06); border-color: var(--muc-tim); }
.av-o[aria-pressed="true"] {
  border-color: var(--muc-tim); border-width: 2.5px; background: var(--muc-tim-bg);
}
.danh-chu { min-width: 0; }
.danh-ten { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.danh-phu { font-size: 12.5px; color: var(--ink-soft); }

.thanh-nhom { display: flex; gap: 14px; flex-wrap: wrap; flex: 1 1 260px; min-width: 0; }
.thanh { flex: 1 1 78px; min-width: 0; }
.thanh-nhan {
  display: flex; justify-content: space-between; gap: 6px;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-soft); font-weight: 600; margin-bottom: 3px;
}
.thanh-ray { height: 7px; border-radius: 4px; background: var(--vien); overflow: hidden; }
.thanh-day { height: 100%; border-radius: 4px; transition: width .35s ease; }

/* ---------- Thẻ ---------- */
.the {
  background: var(--paper-2);
  border: 1.5px solid var(--vien);
  border-radius: 4px;
  padding: 16px 18px;
}
.the-dau {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
}
.the-dau h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-soft); font-weight: 700; }

.luoi { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 760px) { .luoi { grid-template-columns: 1fr; } }

/* ---------- Thanh địa điểm ---------- */
.noi-bar { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
.noi {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 14px; border-radius: 3px;
  border: 1.5px solid var(--vien-dam);
  background: var(--paper-2); color: var(--ink);
  font-weight: 600; font-size: 14px;
  transition: transform .12s ease, background .15s ease;
}
.noi:hover:not(:disabled) { transform: translateY(-1.5px); }
.noi[aria-pressed="true"] {
  background: var(--muc-tim); border-color: var(--muc-tim); color: #fff;
}
.noi:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- Hành động ---------- */
.hd-list { display: grid; gap: 9px; }
.hd {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 14px;
  align-items: center; width: 100%; text-align: left;
  padding: 12px 14px; border-radius: 3px;
  border: 1.5px solid var(--vien); background: var(--paper);
  color: var(--ink);
  transition: border-color .14s ease, transform .12s ease;
}
.hd:hover:not(:disabled) { border-color: var(--muc-tim); transform: translateX(2.5px); }
.hd:disabled { opacity: .42; cursor: not-allowed; }
.hd-ten { font-weight: 700; font-size: 14.5px; }
.hd-mo { grid-column: 1; font-size: 12.5px; color: var(--ink-soft); }
.hd-gia {
  grid-row: 1 / span 2; font-size: 12px; font-weight: 700;
  padding: 4px 9px; border-radius: 3px; white-space: nowrap;
  background: var(--muc-tim-bg); color: var(--muc-tim);
}

/* ---------- Bảng điểm ---------- */
.mon-row {
  display: grid; grid-template-columns: 1fr auto; gap: 3px 12px;
  padding: 9px 0; border-bottom: 1px dashed var(--vien);
}
.mon-row:last-child { border-bottom: 0; }
.mon-ten { font-weight: 600; font-size: 14px; }
.mon-diem {
  grid-row: 1 / span 2; align-self: center;
  font-family: var(--f-viet); font-size: 30px; font-weight: 700; line-height: 1;
  color: var(--but-do);
}
.mon-ray { height: 5px; border-radius: 3px; background: var(--vien); overflow: hidden; }
.mon-day { height: 100%; transition: width .35s ease; }

.chiso-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.chiso-ten { flex: 1 1 auto; font-size: 13.5px; font-weight: 600; min-width: 0; }
.chiso-so { font-family: var(--f-viet); font-size: 23px; font-weight: 700; color: var(--muc-tim); line-height: 1; }

/* ---------- Lịch năm học ---------- */
.lich { display: flex; gap: 4px; margin-bottom: 4px; }
.lich-o {
  flex: 1; min-width: 0; height: 32px; border-radius: 3px;
  border: 1.5px solid var(--vien-dam); background: var(--paper);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: var(--ink-faint);
}
.lich-o.qua { background: var(--vien); color: var(--ink-soft); }
.lich-o.nay { background: var(--muc-tim); border-color: var(--muc-tim); color: #fff; }
.lich-o.thi { border-color: var(--but-do); color: var(--but-do); }
.lich-o.nay.thi { background: var(--but-do); color: #fff; }
.lich-chu { font-size: 12px; color: var(--ink-soft); text-align: center; }

/* ---------- Nhật ký ---------- */
.nk { max-height: 230px; overflow-y: auto; display: grid; gap: 0; }
.nk-d {
  display: grid; grid-template-columns: auto 1fr; gap: 10px;
  padding: 7px 0; border-bottom: 1px dashed var(--vien);
  font-size: 13px;
}
.nk-d:last-child { border-bottom: 0; }
.nk-ngay { font-size: 11px; font-weight: 700; color: var(--ink-faint); white-space: nowrap; padding-top: 2px; }
.nk-tot { color: var(--bang-xanh); }
.nk-xau { color: var(--but-do); }

/* ---------- Thông báo nổi ---------- */
.toast-khu {
  position: fixed; z-index: 40;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 8px; justify-items: center; pointer-events: none;
}
.toast {
  background: var(--ink); color: var(--paper);
  padding: 9px 17px; border-radius: 3px; font-size: 13.5px; font-weight: 600;
  box-shadow: 0 4px 14px var(--shadow); max-width: 100%;
  animation: toastIn .25s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Hộp thoại ---------- */
.man {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(10, 14, 26, 0.62);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.hop {
  background: var(--paper-2);
  border: 2px solid var(--vien-dam); border-radius: 5px;
  box-shadow: 0 14px 44px rgba(0,0,0,.34);
  width: 100%; max-width: 480px; padding: 22px;
  animation: hopIn .22s ease;
}
@keyframes hopIn { from { opacity: 0; transform: scale(.96) translateY(10px); } }
.hop h3 { font-size: 19px; margin-bottom: 9px; letter-spacing: -0.015em; }
.hop-mo { font-size: 14.5px; color: var(--ink-soft); margin: 0 0 17px; }
.lc-list { display: grid; gap: 8px; }
.lc {
  width: 100%; text-align: left; padding: 12px 15px;
  border: 1.5px solid var(--vien-dam); border-radius: 3px;
  background: var(--paper); color: var(--ink); font-weight: 600; font-size: 14px;
  transition: border-color .14s ease, transform .12s ease;
}
.lc:hover:not(:disabled) { border-color: var(--muc-tim); transform: translateX(2.5px); }
.lc:disabled { opacity: .4; cursor: not-allowed; }
.lc-khoa { display: block; font-size: 11.5px; font-weight: 600; color: var(--but-do); margin-top: 3px; }

/* ---------- Form tạo nhân vật ---------- */
.form-hang { display: grid; gap: 7px; margin-bottom: 16px; }
.form-hang label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); }
.form-hang input[type="text"] {
  padding: 11px 13px; border-radius: 3px; font-size: 15px;
  border: 1.5px solid var(--vien-dam); background: var(--paper); color: var(--ink);
  font-family: inherit; width: 100%;
}
.gt-nhom { display: flex; gap: 8px; }
.gt {
  flex: 1; padding: 11px; border-radius: 3px; font-weight: 700; font-size: 14px;
  border: 1.5px solid var(--vien-dam); background: var(--paper); color: var(--ink);
}
.gt[aria-pressed="true"] { background: var(--muc-tim); border-color: var(--muc-tim); color: #fff; }

.nut-chinh {
  width: 100%; padding: 13px; border-radius: 3px; font-weight: 800; font-size: 15px;
  border: 0; background: var(--muc-tim); color: #fff;
  transition: filter .14s ease;
}
.nut-chinh:hover:not(:disabled) { filter: brightness(1.1); }
.nut-chinh:disabled { opacity: .45; cursor: not-allowed; }
.nut-phu {
  padding: 9px 15px; border-radius: 3px; font-weight: 700; font-size: 13px;
  border: 1.5px solid var(--vien-dam); background: transparent; color: var(--ink-soft);
}

/* ---------- Bảng công cụ (debug) ---------- */
.cong-cu {
  margin-top: 20px; border: 1.5px dashed var(--vien-dam); border-radius: 4px;
  background: var(--paper-2); padding: 14px 16px;
}
.cong-cu summary {
  cursor: pointer; font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft);
}
.cc-hang { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 13px; }
.cc-ghi { font-size: 12.5px; color: var(--ink-soft); margin: 11px 0 0; }
.sw { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; }

.the-ket {
  text-align: center; padding: 26px 20px;
}
.ket-diem { font-family: var(--f-viet); font-size: 62px; font-weight: 700; line-height: 1; }
.ket-dat { color: var(--bang-xanh); }
.ket-truot { color: var(--but-do); }

.phe {
  font-family: var(--f-viet); font-size: 20px; color: var(--but-do);
  border-left: 3px solid var(--but-do); padding: 2px 0 2px 13px; margin-top: 14px;
}

.cb { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 3px; letter-spacing: .03em; }
.cb-tot { background: var(--bang-bg); color: var(--bang-xanh); }
.cb-xau { background: var(--but-do-bg); color: var(--but-do); }
.cb-thuong { background: var(--muc-tim-bg); color: var(--muc-tim); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<div class="bia" id="bia" hidden>
  <div class="bia-in">
    <div class="danh">
      <button class="avatar" id="av" type="button" title="Đổi ngoại hình" aria-label="Đổi ngoại hình">🙂</button>
      <div class="danh-chu">
        <div class="danh-ten" id="hTen">—</div>

<div class="wrap">
  <div id="manChoi" hidden>
    <div class="noi-bar" id="noiBar"></div>
    <div class="luoi">
      <div style="display:grid;gap:18px;min-width:0">
        <section class="the">
          <div class="the-dau"><h2 id="noiTen">Ở nhà</h2><span id="noiCb"></span></div>
          <div class="hd-list" id="hdList"></div>

          <div class="the-dau"><h2>Nhật ký</h2></div>

      </div>
      <div style="display:grid;gap:18px;min-width:0">
        <section class="the">
          <div class="the-dau"><h2>Năm học</h2><span class="num" id="namCb"></span></div>
          <div class="lich" id="lich"></div>
          <p class="lich-chu" id="lichChu"></p>

        <button class="nut-phu" id="ccSk">Hồi phục toàn bộ</button>

      </div>
      <p class="cc-ghi" id="ccGhi"></p>
    </details>
  </div>
</div>

<div class="toast-khu" id="toastKhu"></div>
<div id="manHop"></div>

<script>
"use strict";

/* ===================================================================
   ENGINE — logic thuần, không chạm DOM, không chạm localStorage.
   Toàn bộ khối này bê thẳng lên server Node được, không sửa một dòng.
   Đây là cách giữ "server-authoritative" khi chưa có server.
   =================================================================== */
const Engine = (() => {

  const NAM_THUONG = 7 * 24 * 60 * 60 * 1000;  // 1 năm học = 7 ngày thật
  const NAM_NHANH  = 6 * 60 * 1000;            // chế độ tua: 6 phút
  const AP_THUONG  = 45 * 60 * 1000;           // 1 AP / 45 phút
  const AP_NHANH   = 1500;                     // 1 AP / 1,5 giây
  const AP_MAX     = 20;
  const NGAY_NAM   = 7;                        // 7 ngày học mỗi năm
  const TUOI_DAU   = 6;
  const LOP_CUOI   = 3;                        // v0.1 dừng ở lớp 3
  const DIEM_DAU   = 4.6;                      // đầu năm chưa biết bài — dưới mức đậu
  const QUEN_NGAY  = 0.12;                     // mỗi ngày không ôn thì quên bớt

  // quiz: true  → thi viết, người chơi trả lời câu hỏi thật
  // quiz: false → môn thực hành, chấm theo chỉ số (Thể dục không thi trắc nghiệm)
  const MON = [
    { id: "toan", ten: "Toán",       cs: "triTue",  quiz: true  },
    { id: "van",  ten: "Tiếng Việt", cs: "triTue",  quiz: true  },
    { id: "td",   ten: "Thể dục",    cs: "theChat", quiz: false },
  ];

  const CAU_GIUA_KY = 4;   // số câu mỗi môn, kiểm tra giữa kỳ
  const CAU_CUOI_NAM = 6;  // số câu mỗi môn, thi cuối năm
  const TY_TRONG_BAI_LAM = 0.7;   // bài làm chiếm 70%, điểm môn tích luỹ 30%

  const CHI_SO = [
    { id: "triTue",  ten: "Trí tuệ"   },
    { id: "theChat", ten: "Thể chất"  },
    { id: "giaoTiep",ten: "Giao tiếp" },
  ];

  // Ngoại hình v0.1: chọn một gương mặt có sẵn. Chưa ghép lớp tóc/da/áo —
  // thứ đó để v0.2, khi đã biết game đáng làm tiếp.
  const AVATARS = [
    "👦", "👦🏻", "👦🏼", "👦🏽", "👦🏾", "👦🏿",
    "👧", "👧🏻", "👧🏼", "👧🏽", "👧🏾", "👧🏿",
    "🧒", "🧒🏻", "🧒🏼", "🧒🏽", "🧒🏾", "🧒🏿",
  ];
  const avatarMacDinh = gioiTinh => (gioiTinh === "nu" ? "👧" : "👦");

  /* --- Lịch năm học: 7 ngày, 2 ngày thi --- */
  function phaNgay(ngay) {
    if (ngay <= 3) return { ma: "hk1",  ten: "Học kỳ I",        thi: false };
    if (ngay === 4) return { ma: "gk",  ten: "Kiểm tra giữa kỳ", thi: true  };
    if (ngay <= 6) return { ma: "hk2",  ten: "Học kỳ II",       thi: false };
    return            { ma: "ck",       ten: "Thi cuối năm",     thi: true  };
  }

  function msMotNam(nhanh) { return nhanh ? NAM_NHANH : NAM_THUONG; }
  function msMotAp(nhanh)  { return nhanh ? AP_NHANH  : AP_THUONG;  }

  function taoNhanVat(ten, gioiTinh, nowMs, avatar) {
    return {
      v: 1,
      ten, gioiTinh,
      avatar: AVATARS.indexOf(avatar) >= 0 ? avatar : avatarMacDinh(gioiTinh),
      lop: 1,
      ngay: 1,
      tuoiCong: 0,            // tuổi tích luỹ (đơn vị: năm), cộng dồn qua mọi chế độ
      moc: nowMs,             // mốc tính tuổi gần nhất
      mocAp: nowMs,           // mốc hồi AP gần nhất
      ap: AP_MAX, apMax: AP_MAX,
      tamTrang: 70, sucKhoe: 85,
      triTue: 30, theChat: 30, giaoTiep: 30,
      diem: { toan: DIEM_DAU, van: DIEM_DAU, td: DIEM_DAU },
      hanhKiem: 100,
      soLuuBan: 0,
      daThiLai: false,
      nhanh: false,
      nhatKy: [],
      ketThuc: null,
      choSuKien: null,
      hetNam: null,
    };
  }

  /* --- Tuổi sinh học: trôi theo thời gian thật, không ai dừng được --- */
  function tick(s, nowMs) {
    const nam = msMotNam(s.nhanh);
    const dt = Math.max(0, nowMs - s.moc);
    if (dt > 0) { s.tuoiCong += dt / nam; s.moc = nowMs; }

    const apMs = msMotAp(s.nhanh);
    const dtAp = Math.max(0, nowMs - s.mocAp);
    const them = Math.floor(dtAp / apMs);
    if (them > 0) {
      s.ap = Math.min(s.apMax, s.ap + them);
      s.mocAp += them * apMs;
    }
    return s;
  }

  const tuoi      = s => TUOI_DAU + s.tuoiCong;
  const tuoiChuan = s => TUOI_DAU + (s.lop - 1);   // lớp 1 → 6 tuổi

  /* Độ lệch giữa hai trục tuổi — đây là luận điểm cốt lõi của thiết kế */
  function tinhTrang(s) {
    const lech = tuoi(s) - tuoiChuan(s);
    if (lech < -0.15) return { ma: "sommm", ten: "Thần đồng",     lop: "cb-thuong" };
    if (lech < 1.0)   return { ma: "dung",  ten: "Đúng tuổi",     lop: "cb-tot"    };
    if (lech < 2.0)   return { ma: "cham",  ten: "Chậm tiến độ",  lop: "cb-xau"    };
    return              { ma: "ratcham",    ten: "Quá tuổi",      lop: "cb-xau"    };
  }

  const heSoTamTrang = s => (s.tamTrang < 30 ? 0.5 : s.tamTrang < 55 ? 0.8 : 1);
  const dtb = s => MON.reduce((t, m) => t + s.diem[m.id], 0) / MON.length;

  /* --- Danh mục hành động --- */
  const HANH_DONG = {
    truong: [
      { id: "nghe",  ten: "Nghe giảng",    ap: 2, mo: "An toàn, đều đặn. Bỏ nhiều buổi sẽ bị hạ hạnh kiểm." },
      { id: "tuhoc", ten: "Tự học",        ap: 3, mo: "Hiệu quả nhất, nhưng mệt và chán." },
      { id: "nhom",  ten: "Học nhóm",      ap: 3, mo: "Vừa lên điểm vừa thân với bạn bè." },
      { id: "hoi",   ten: "Hỏi thầy cô",   ap: 2, mo: "Tự động nhắm vào môn đang yếu nhất." },
    ],
    nha: [
      { id: "doc",  ten: "Đọc sách",  ap: 2, mo: "Tăng trí tuệ lâu dài, hơi buồn ngủ." },
      { id: "com",  ten: "Ăn cơm",    ap: 1, mo: "Hồi sức khoẻ." },
      { id: "tv",   ten: "Xem ti vi", ap: 1, mo: "Hồi tâm trạng nhanh." },
      { id: "ngu",  ten: "Đi ngủ",    ap: 0, mo: "Kết thúc ngày hôm nay." },
    ],
    san: [
      { id: "bong", ten: "Đá bóng",      ap: 3, mo: "Thể chất và tâm trạng lên, sức khoẻ xuống." },
      { id: "ban",  ten: "Chơi với bạn", ap: 2, mo: "Cách hồi tâm trạng tốt nhất." },
      { id: "chay", ten: "Chạy bộ",      ap: 2, mo: "Vừa khoẻ người vừa bền sức." },
    ],
  };

  const NOI = [
    { id: "nha",    ten: "Ở nhà",    icon: "🏠" },
    { id: "truong", ten: "Trường",   icon: "🏫" },
    { id: "san",    ten: "Sân chơi", icon: "⚽" },
  ];

  function timHD(noi, id) { return (HANH_DONG[noi] || []).find(h => h.id === id); }

  function keppBien(s) {
    s.tamTrang = Math.max(0, Math.min(100, s.tamTrang));
    s.sucKhoe  = Math.max(0, Math.min(100, s.sucKhoe));
    s.hanhKiem = Math.max(0, Math.min(100, s.hanhKiem));
    s.ap       = Math.max(0, Math.min(s.apMax, s.ap));
    for (const c of CHI_SO) s[c.id] = Math.max(0, Math.min(100, s[c.id]));
    for (const m of MON) s.diem[m.id] = Math.max(0, Math.min(10, s.diem[m.id]));
    return s;
  }

  function monYeuNhat(s) {
    return MON.reduce((a, b) => (s.diem[a.id] <= s.diem[b.id] ? a : b)).id;
  }

  /* Thực hiện một hành động. Trả về { ok, loi, ghi } — không ném lỗi. */
  function lamHanhDong(s, noi, hdId, monId, nowMs) {
    if (s.ketThuc) return { ok: false, loi: "Nhân vật đã kết thúc chặng này." };
    if (s.choSuKien) return { ok: false, loi: "Hãy xử lý việc đang xảy ra trước." };
    if (s.hetNam) return { ok: false, loi: "Hãy xem kết quả năm học trước." };

    const hd = timHD(noi, hdId);
    if (!hd) return { ok: false, loi: "Không có hành động này." };

    if (hdId === "ngu") return nguDay(s, nowMs);

    if (s.ap < hd.ap) return { ok: false, loi: "Không đủ năng lượng. Hãy đi ngủ để sang ngày mới." };
    if (noi === "truong" && phaNgay(s.ngay).thi) {
      return { ok: false, loi: "Hôm nay là ngày thi — hãy vào phòng thi." };
    }

    s.ap -= hd.ap;
    const k = heSoTamTrang(s);
    const ghi = [];
    const mon = monId && s.diem[monId] !== undefined ? monId : monYeuNhat(s);

    switch (hdId) {
      case "nghe":
        s.diem[mon] += 0.25 * k; s.tamTrang -= 2;
        ghi.push(`Nghe giảng ${tenMon(mon)}`); break;
      case "tuhoc":
        s.diem[mon] += 0.45 * k * (0.6 + s.triTue / 125); s.tamTrang -= 6; s.triTue += 0.4;
        ghi.push(`Tự học ${tenMon(mon)}`); break;
      case "nhom":
        s.diem[mon] += 0.40 * k; s.giaoTiep += 1.5; s.tamTrang -= 2;
        ghi.push(`Học nhóm ${tenMon(mon)}`); break;
      case "hoi": {
        const y = monYeuNhat(s);
        s.diem[y] += 0.35 * k; s.triTue += 0.6; s.tamTrang -= 1;
        ghi.push(`Hỏi thầy cô về ${tenMon(y)}`); break;
      }
      case "doc":  s.triTue += 1.2; s.tamTrang -= 3; ghi.push("Đọc sách ở nhà"); break;
      case "com":  s.sucKhoe += 9;  s.tamTrang += 3; ghi.push("Ăn cơm với gia đình"); break;
      case "tv":   s.tamTrang += 11; ghi.push("Xem ti vi"); break;
      case "bong": s.theChat += 2;  s.tamTrang += 8; s.sucKhoe -= 4; ghi.push("Đá bóng ngoài sân"); break;
      case "ban":  s.giaoTiep += 2; s.tamTrang += 11; ghi.push("Chơi với bạn bè"); break;
      case "chay": s.theChat += 2;  s.sucKhoe += 3; s.tamTrang -= 1; ghi.push("Chạy bộ"); break;
    }

    keppBien(s);
    return { ok: true, ghi: ghi.join(", ") };
  }

  function tenMon(id) { const m = MON.find(x => x.id === id); return m ? m.ten : id; }

  /* --- Đi ngủ: chốt ngày, hao mòn, bốc sự kiện, chạm mốc thi --- */
  function nguDay(s, nowMs) {
    if (!s.nhanh && s.ap > 4) {
      return { ok: false, loi: "Còn sớm, hãy dùng hết năng lượng trong ngày đã." };
    }
    if (phaNgay(s.ngay).thi) {
      return { ok: false, loi: "Chưa thi xong thì chưa ngủ được." };
    }

    s.sucKhoe -= 2;
    s.tamTrang -= 2;
    if (s.sucKhoe < 25) { s.tamTrang -= 6; }

    // Không ôn thì quên — đây là thứ buộc người chơi phải học đều
    for (const m of MON) s.diem[m.id] -= QUEN_NGAY;

    s.ngay += 1;
    s.ap = s.apMax;
    s.mocAp = nowMs;
    keppBien(s);

    const sk = bocSuKien(s);
    if (sk) s.choSuKien = sk;

    return { ok: true, ghi: `Sang ngày ${s.ngay} — ${phaNgay(s.ngay).ten}`, sangNgay: true };
  }

  /* --- Thi -----------------------------------------------------------------
     Môn thi viết: điểm do BÀI LÀM THẬT quyết định (70%), điểm môn tích luỹ
     đóng góp 30%. Học chăm không thay người chơi trả lời đúng, nhưng nâng nền
     và cho thêm lượt trợ giúp.
     Môn thực hành (Thể dục): chấm theo chỉ số, không có đề trắc nghiệm.      */

  function diemThucHanh(s, monId, rng) {
    const base = s.diem[monId];
    const mon = MON.find(m => m.id === monId);
    // Chỉ số nền kéo điểm, nhưng có trần — không để một chỉ số gánh cả bảng điểm
    const boost = Math.max(-1.0, Math.min(1.2, (s[mon.cs] - 40) / 30));
    const mood  = s.tamTrang < 30 ? -1.2 : s.tamTrang < 55 ? -0.4 : 0.2;
    const may   = (rng() - 0.5) * 1.4;
    return Math.max(0, Math.min(10, base + boost + mood + may));
  }

  function diemTuBaiLam(s, monId, dung, tong) {
    if (!tong) return s.diem[monId];
    const diemLam = (dung / tong) * 10;
    const d = diemLam * TY_TRONG_BAI_LAM + s.diem[monId] * (1 - TY_TRONG_BAI_LAM);
    return Math.max(0, Math.min(10, d));
  }

  /* lamBai = { toan: {dung, tong}, van: {dung, tong} } — do tầng giao diện thu thập */
  function chamMon(s, lamBai, rng) {
    return MON.map(m => {
      const bl = lamBai && lamBai[m.id];
      if (m.quiz && bl && bl.tong) {
        return { id: m.id, ten: m.ten, quiz: true,
                 dung: bl.dung, tong: bl.tong,
                 diem: diemTuBaiLam(s, m.id, bl.dung, bl.tong) };
      }
      return { id: m.id, ten: m.ten, quiz: false, diem: diemThucHanh(s, m.id, rng) };
    });
  }

  function thiGiuaKy(s, lamBai, rng = Math.random) {
    const kq = chamMon(s, lamBai, rng);
    for (const r of kq) s.diem[r.id] = (s.diem[r.id] * 2 + r.diem) / 3;  // điểm thi kéo điểm môn
    keppBien(s);
    s.ngay += 1;
    s.ap = s.apMax;
    const yeu = kq.filter(r => r.diem < 4.5);
    return { loai: "gk", kq, yeu };
  }

  function thiCuoiNam(s, lamBai, rng = Math.random) {
    const kq = chamMon(s, lamBai, rng);
    const tb = kq.reduce((t, r) => t + r.diem, 0) / kq.length;
    const liet = kq.filter(r => r.diem < 3.5);
    const dat = tb >= 5 && liet.length === 0;
    return { loai: "ck", kq, tb, liet, dat, choThiLai: !dat && !s.daThiLai };
  }

  function apDungKetQua(s, kq, nowMs) {
    s.hetNam = null;
    if (kq.dat) {
      s.lop += 1;
      s.daThiLai = false;
      s.ngay = 1;
      s.ap = s.apMax; s.mocAp = nowMs;
      s.tamTrang = Math.min(100, s.tamTrang + 20);
      s.sucKhoe  = Math.min(100, s.sucKhoe + 15);
      for (const m of MON) s.diem[m.id] = DIEM_DAU;     // năm mới, điểm về mốc
      if (s.lop > LOP_CUOI) {
        s.ketThuc = { ma: "hetnoidung", ten: "Hết nội dung bản thử nghiệm" };
      }
      return { lenLop: true };
    }
    s.soLuuBan += 1;
    s.daThiLai = false;
    s.ngay = 1;
    s.ap = s.apMax; s.mocAp = nowMs;
    s.tamTrang = Math.max(0, s.tamTrang - 25);
    for (const m of MON) s.diem[m.id] = DIEM_DAU;
    return { lenLop: false };
  }

  function xao(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function layDe(lop, monId, soCau, rng = Math.random) {
    const kho = (CAU_HOI[lop] && CAU_HOI[lop][monId]) || [];
    if (!kho.length) return [];
    return xao(kho, rng).slice(0, Math.min(soCau, kho.length)).map(c => {
      const dapAnDung = c.d[0];
      const da = xao(c.d, rng);
      return { h: c.h, d: da, iDung: da.indexOf(dapAnDung) };
    });
  }

  function bocSuKien(s, rng = Math.random) {
    if (rng() > 0.55) return null;
    const hop = SU_KIEN.filter(e => { try { return e.dk(s); } catch { return false; } });
    if (!hop.length) return null;
    const tong = hop.reduce((t, e) => t + e.trong, 0);
    let r = rng() * tong;
    for (const e of hop) { r -= e.trong; if (r <= 0) return e.id; }
    return hop[hop.length - 1].id;
  }

    if (lc.dk && !lc.dk(s)) return { ok: false, loi: lc.khoa || "Chưa đủ điều kiện." };

    const hq = lc.hq || {};
    for (const [k, v] of Object.entries(hq)) {

    keppBien(s);
    s.choSuKien = null;
    return { ok: true, ghi: lc.ghi || sk.ten, tot: diemHuong(hq) };
  }

    taoNhanVat, tick, tuoi, tuoiChuan, tinhTrang, dtb, phaNgay,
    lamHanhDong, nguDay, thiGiuaKy, thiCuoiNam, apDungKetQua,
    layDe, soTroGiup, diemTuBaiLam, chamMon,
    timSuKien, chonSuKien, tenMon, monYeuNhat, heSoTamTrang,
    msMotNam, msMotAp,
  };
})();


/* ===================================================================
   LƯU TRỮ — tách riêng, dễ thay bằng lời gọi API sau này
   =================================================================== */
const KHOA = "dongdoi.v1";
const Luu = {
  doc() {
    try {
      const t = localStorage.getItem(KHOA);
      if (!t) return null;
      const d = JSON.parse(t);
      return d && d.v === 1 ? d : null;
    } catch { return null; }
  },
  ghi(s) {
    try { localStorage.setItem(KHOA, JSON.stringify(s)); return true; }
    catch { return false; }
  },
  xoa() { try { localStorage.removeItem(KHOA); } catch {} },
};


/* ===================================================================
   GIAO DIỆN
   =================================================================== */
let S = null;
let noiHienTai = "nha";
let monChon = "toan";
let heNhip = null;
let luuDuoc = true;

const $ = id => document.getElementById(id);

function toast(chu, loai) {
  const k = $("toastKhu");
  const d = document.createElement("div");
  d.className = "toast";
  if (loai === "xau") d.style.background = "var(--but-do)";
  if (loai === "tot") d.style.background = "var(--bang-xanh)";
  if (loai === "xau" || loai === "tot") d.style.color = "#fff";
  d.textContent = chu;
  k.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

function nhatKy(chu, huong) {
  S.nhatKy.unshift({ lop: S.lop, ngay: S.ngay, chu, huong: huong || 0 });
  if (S.nhatKy.length > 40) S.nhatKy.length = 40;
}

/* Hộp nào đang mở. Dùng để chặn vòng lặp mỗi giây vẽ đè lên hộp ĐANG mở,
   mà vẫn cho phép chuyển từ hộp này sang hộp khác (thi → kết quả năm học).
   Chốt chặn theo kiểu "có hộp nào mở thì thôi" sẽ làm kẹt ở màn thi. */
let hopHienTai = null;

function dongHop() { $("manHop").innerHTML = ""; hopHienTai = null; }

function moHop(html, ten) {
  const m = $("manHop");
  m.innerHTML = `<div class="man"><div class="hop" role="dialog" aria-modal="true">${html}</div></div>`;
  hopHienTai = ten || null;
  const f = m.querySelector("button, input");
  if (f) f.focus();
}

const soLam = n => (Math.round(n * 10) / 10).toFixed(1).replace(".", ",");
const soNguyen = n => String(Math.round(n));

function tuoiChu(s) {
  const t = Engine.tuoi(s);
  const nam = Math.floor(t);
  const thang = Math.floor((t - nam) * 12);
  return `${nam} tuổi ${thang} tháng`;
}

/* ---------- Chọn ngoại hình ---------- */
function oAvatar(dangChon) {
  return Engine.AVATARS.map(a =>
    `<button class="av-o" type="button" data-av="${a}" aria-pressed="${a === dangChon}" aria-label="Gương mặt ${a}">${a}</button>`
  ).join("");
}

/* Gắn sự kiện cho lưới avatar. chon(a) được gọi mỗi lần người chơi bấm. */
function noiLuoiAvatar(idLuoi, chon) {
  const luoi = document.getElementById(idLuoi);
  if (!luoi) return;
  for (const b of luoi.querySelectorAll(".av-o")) {
    b.onclick = () => {
      for (const x of luoi.querySelectorAll(".av-o")) x.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-pressed", "true");
      chon(b.dataset.av);
    };
  }
}

/* Đổi ngoại hình giữa chừng — bấm vào gương mặt trên thanh đầu trang */
function manDoiAvatar() {
  if (!S || hopHienTai) return;          // đang có hộp khác thì thôi
  const dangChon = S.avatar || Engine.avatarMacDinh(S.gioiTinh);
  moHop(`
    <h3>Đổi ngoại hình</h3>
    <p class="hop-mo">Chọn gương mặt cho ${S.ten}.</p>
    <div class="av-luoi" id="avLuoi2">${oAvatar(dangChon)}</div>
    <div style="margin-top:18px"><button class="nut-chinh" id="btAvXong">Xong</button></div>
  `, "avatar");
  noiLuoiAvatar("avLuoi2", a => { S.avatar = a; Luu.ghi(S); ve(); });
  $("btAvXong").onclick = () => { dongHop(); nhip(); };
}

/* ---------- Màn tạo nhân vật ---------- */
function manTao() {
  moHop(`
    <h3>Một đứa trẻ vừa chào đời</h3>
    <p class="hop-mo">Đặt tên cho nhân vật. Em sẽ bắt đầu từ lớp 1, năm 6 tuổi.</p>
    <div class="form-hang">
      <label for="iTen">Tên nhân vật</label>
      <input type="text" id="iTen" maxlength="24" placeholder="Nguyễn An" autocomplete="off">
    </div>
    <div class="form-hang">
      <label>Giới tính</label>
      <div class="gt-nhom">
        <button class="gt" id="gtNam" aria-pressed="true">Nam</button>
        <button class="gt" id="gtNu" aria-pressed="false">Nữ</button>
      </div>
    </div>
    <div class="form-hang">
      <label>Ngoại hình</label>
      <div class="av-luoi" id="avLuoi">${oAvatar(Engine.avatarMacDinh("nam"))}</div>
    </div>
    <button class="nut-chinh" id="btTao">Bắt đầu</button>
    <p class="cc-ghi" style="text-align:center">Tiến trình lưu ngay trong trình duyệt này.</p>
  `, "tao");

  let gt = "nam";
  let av = Engine.avatarMacDinh("nam");
  let tuChon = false;   // người chơi đã tự chọn mặt thì đừng đổi theo giới tính nữa

  const veLuoi = () => {
    $("avLuoi").innerHTML = oAvatar(av);
    noiLuoiAvatar("avLuoi", a => { av = a; tuChon = true; });
  };

  const dat = g => {
    gt = g;
    $("gtNam").setAttribute("aria-pressed", String(g === "nam"));
    $("gtNu").setAttribute("aria-pressed", String(g === "nu"));
    if (!tuChon) { av = Engine.avatarMacDinh(g); veLuoi(); }
  };
  $("gtNam").onclick = () => dat("nam");
  $("gtNu").onclick = () => dat("nu");
  veLuoi();

  const tao = () => {
    const ten = ($("iTen").value || "").trim() || "Bé An";
    S = Engine.taoNhanVat(ten, gt, Date.now(), av);
    nhatKy("Chào đời, bắt đầu lớp 1", 1);
    Luu.ghi(S);
    dongHop();
    batDauChoi();
  };
  $("btTao").onclick = tao;
  $("iTen").onkeydown = e => { if (e.key === "Enter") tao(); };
}

/* ---------- Vòng lặp chính ---------- */
function batDauChoi() {
  $("bia").hidden = false;
  $("manChoi").hidden = false;
  $("av").onclick = manDoiAvatar;
  hdChuKy = monChuKy = nkChuKy = lichChuKy = csChuKy = null;   // nhân vật mới thì vẽ lại từ đầu
  veNoiBar();
  nhip();
  if (heNhip) clearInterval(heNhip);
  heNhip = setInterval(nhip, 1000);
}

function nhip() {
  if (!S) return;
  Engine.tick(S, Date.now());
  ve();
  if (S.choSuKien) manSuKien();
  else if (S.hetNam) manKetNam();
}

function veNoiBar() {
  const b = $("noiBar");
  b.innerHTML = "";
  for (const n of Engine.NOI) {
    const bt = document.createElement("button");
    bt.className = "noi";
    bt.setAttribute("aria-pressed", String(n.id === noiHienTai));
    bt.innerHTML = `<span aria-hidden="true">${n.icon}</span><span>${n.ten}</span>`;
    bt.onclick = () => { noiHienTai = n.id; veNoiBar(); ve(); };
    b.appendChild(bt);
  }
}

function ve() {
  if (!S) return;
  const t = Engine.tinhTrang(S);

  // bản lưu cũ chưa có avatar — rơi về mặc định theo giới tính
  $("av").textContent = S.avatar || Engine.avatarMacDinh(S.gioiTinh);
  $("hTen").textContent = S.ten;
  const phu = `${tuoiChu(S)} · Lớp ${S.lop} · <span class="cb ${t.lop}">${t.ten}</span>`;
  if ($("hPhu").innerHTML !== phu) $("hPhu").innerHTML = phu;

  const dat = (so, bar, v, max) => {
    $(so).textContent = soNguyen(v);
    $(bar).style.width = Math.max(0, Math.min(100, (v / max) * 100)) + "%";
  };
  dat("apSo", "apBar", S.ap, S.apMax);
  dat("ttSo", "ttBar", S.tamTrang, 100);
  dat("skSo", "skBar", S.sucKhoe, 100);

  veLich();
  veHanhDong();
  veMon();
  veChiSo();
  veNhatKy();

  $("swNhanh").checked = !!S.nhanh;
  $("ccGhi").textContent = S.nhanh
    ? "Đang tua nhanh: 1 năm học ≈ 6 phút, năng lượng hồi 1 điểm/1,5 giây. Dùng để thử cân bằng số."
    : "Nhịp thật: 1 năm học = 7 ngày, năng lượng hồi 1 điểm/45 phút. Bật tua nhanh để thử trọn một năm trong ít phút.";
}

let lichChuKy = null;
function veLich() {
  const ky = S.lop + "|" + S.ngay;
  if (ky === lichChuKy) return;
  lichChuKy = ky;

  const l = $("lich");
  l.innerHTML = "";
  for (let i = 1; i <= Engine.NGAY_NAM; i++) {
    const p = Engine.phaNgay(i);
    const o = document.createElement("div");
    o.className = "lich-o" + (p.thi ? " thi" : "") + (i < S.ngay ? " qua" : "") + (i === S.ngay ? " nay" : "");
    o.textContent = p.thi ? "✎" : String(i);
    o.title = `Ngày ${i} — ${p.ten}`;
    l.appendChild(o);
  }
  const p = Engine.phaNgay(S.ngay);
  $("lichChu").textContent = `Ngày ${S.ngay}/${Engine.NGAY_NAM} — ${p.ten}`;
  $("namCb").textContent = `Lớp ${S.lop}`;
}

/* Vòng lặp chạy mỗi giây. Nếu dựng lại DOM mỗi lần thì thẻ <select> vừa mở
   đã bị xoá và tạo mới, nhật ký cuộn về đầu, thanh điểm mất hiệu ứng.
   Nên: chỉ dựng lại khi KHUNG đổi, còn mỗi giây chỉ cập nhật trạng thái. */
let hdChuKy = null;

function veHanhDong() {
  const noi = Engine.NOI.find(n => n.id === noiHienTai);
  $("noiTen").textContent = noi.ten;

  const pha = Engine.phaNgay(S.ngay);
  $("noiCb").innerHTML = pha.thi && noiHienTai === "truong"
    ? `<span class="cb cb-xau">${pha.ten}</span>` : "";

  const chuKy = [noiHienTai, pha.ma, !!S.ketThuc].join("|");
  if (chuKy !== hdChuKy) { hdChuKy = chuKy; dungHanhDong(pha); }
  capNhatHanhDong();
}

function dungHanhDong(pha) {
  const ds = $("hdList");
  ds.innerHTML = "";

  if (noiHienTai === "truong" && pha.thi) {
    const bt = document.createElement("button");
    bt.className = "nut-chinh";
    bt.textContent = pha.ma === "gk" ? "Vào phòng kiểm tra giữa kỳ" : "Vào phòng thi cuối năm";
    bt.onclick = () => vaoThi(pha.ma);
    ds.appendChild(bt);
    const p = document.createElement("p");
    p.className = "cc-ghi";
    p.textContent = pha.ma === "gk"
      ? `${Engine.CAU_GIUA_KY} câu mỗi môn. Bài làm chiếm 70% số điểm, điểm tích luỹ 30%.`
      : `${Engine.CAU_CUOI_NAM} câu mỗi môn. Trung bình từ 5,0 và không môn nào dưới 3,5 thì lên lớp.`;
    ds.appendChild(p);
    return;
  }

  if (noiHienTai === "truong") {
    const w = document.createElement("div");
    w.className = "form-hang";
    w.style.marginBottom = "4px";
    const lb = document.createElement("label");
    lb.textContent = "Môn muốn học";
    lb.setAttribute("for", "selMon");
    const sel = document.createElement("select");
    sel.id = "selMon";
    sel.style.cssText = "padding:10px 12px;border-radius:3px;border:1.5px solid var(--vien-dam);background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px;width:100%";
    for (const m of Engine.MON) {
      const o = document.createElement("option");
      o.value = m.id;
      o.textContent = m.ten;
      if (m.id === monChon) o.selected = true;
      sel.appendChild(o);
    }
    sel.onchange = e => { monChon = e.target.value; capNhatHanhDong(); };
    w.append(lb, sel);
    ds.appendChild(w);
  }

  for (const hd of Engine.HANH_DONG[noiHienTai]) {
    const bt = document.createElement("button");
    bt.className = "hd";
    bt.dataset.hd = hd.id;
    bt.innerHTML =
      `<span class="hd-ten">${hd.ten}</span>` +
      `<span class="hd-gia">${hd.ap > 0 ? hd.ap + " ⚡" : "Hết ngày"}</span>` +
      `<span class="hd-mo"></span>`;
    bt.onclick = () => chayHanhDong(hd.id);
    ds.appendChild(bt);
  }
}

/* Chạy mỗi giây. Chỉ ghi vào DOM khi giá trị thật sự đổi — ghi đè vô cớ
   lên <option> cũng đủ làm danh sách đang mở bị đóng. */
function capNhatHanhDong() {
  const sel = document.getElementById("selMon");
  if (sel) {
    for (const o of sel.options) {
      const m = Engine.MON.find(x => x.id === o.value);
      if (!m) continue;
      const chu = `${m.ten} — ${soLam(S.diem[m.id])}`;
      if (o.textContent !== chu) o.textContent = chu;
    }
    if (sel.value !== monChon) sel.value = monChon;
  }

  const ds = Engine.HANH_DONG[noiHienTai] || [];
  for (const bt of document.querySelectorAll("#hdList .hd")) {
    const hd = ds.find(h => h.id === bt.dataset.hd);
    if (!hd) continue;
    const khoaNgu = hd.id === "ngu" && !S.nhanh && S.ap > 4;
    const thieuAp = hd.ap > 0 && S.ap < hd.ap;
    const tat = thieuAp || khoaNgu || !!S.ketThuc;
    if (bt.disabled !== tat) bt.disabled = tat;
    const mo = bt.querySelector(".hd-mo");
    const chu = khoaNgu ? "Còn nhiều năng lượng quá — dùng hết đã." : hd.mo;
    if (mo.textContent !== chu) mo.textContent = chu;
  }
}

let monChuKy = null;
function veMon() {
  const ky = Engine.MON.map(m => S.diem[m.id].toFixed(2)).join("|");
  if (ky === monChuKy) return;   // không đổi thì đừng vẽ lại, để hiệu ứng thanh chạy được
  monChuKy = ky;

  const d = $("monList");
  d.innerHTML = "";
  for (const m of Engine.MON) {
    const v = S.diem[m.id];
    const mau = v < 3.5 ? "var(--but-do)" : v < 5 ? "#d98324" : "var(--bang-xanh)";
    const r = document.createElement("div");
    r.className = "mon-row";
    r.innerHTML =
      `<div class="mon-ten">${m.ten}</div>` +
      `<div class="mon-diem num" style="color:${mau}">${soLam(v)}</div>` +
      `<div class="mon-ray"><div class="mon-day" style="width:${v * 10}%;background:${mau}"></div></div>`;
    d.appendChild(r);
  }
  const tb = Engine.dtb(S);
  $("dtbCb").innerHTML = `<span class="cb ${tb >= 5 ? "cb-tot" : "cb-xau"}">TB ${soLam(tb)}</span>`;
}

let csChuKy = null;
function veChiSo() {
  const ky = Engine.CHI_SO.map(c => Math.round(S[c.id])).join("|") +
             "|" + Math.round(S.hanhKiem) + "|" + Engine.heSoTamTrang(S) + "|" + (S.tamTrang < 30);
  if (ky === csChuKy) return;
  csChuKy = ky;

  const d = $("csList");
  d.innerHTML = "";
  for (const c of Engine.CHI_SO) {
    const r = document.createElement("div");
    r.className = "chiso-row";
    r.innerHTML =
      `<span class="chiso-ten">${c.ten}</span>` +
      `<span class="chiso-so num">${soNguyen(S[c.id])}</span>`;
    d.appendChild(r);
  }
  const hk = document.createElement("div");
  hk.className = "chiso-row";
  hk.style.borderTop = "1px dashed var(--vien)";
  hk.style.marginTop = "6px";
  hk.style.paddingTop = "10px";
  hk.innerHTML =
    `<span class="chiso-ten">Hạnh kiểm</span>` +
    `<span class="chiso-so num" style="color:${S.hanhKiem < 60 ? "var(--but-do)" : "var(--bang-xanh)"}">${soNguyen(S.hanhKiem)}</span>`;
  d.appendChild(hk);

  if (Engine.heSoTamTrang(S) < 1) {
    const c = document.createElement("p");
    c.className = "cc-ghi";
    c.style.color = "var(--but-do)";
    c.textContent = S.tamTrang < 30
      ? "Tâm trạng quá thấp — học chỉ ăn một nửa hiệu quả."
      : "Tâm trạng thấp — học kém hiệu quả. Nên đi chơi một lúc.";
    d.appendChild(c);
  }
}

let nkChuKy = null;
function veNhatKy() {
  const ky = S.nhatKy.length + "|" + (S.nhatKy[0] ? S.nhatKy[0].chu : "");
  if (ky === nkChuKy) return;   // vẽ lại mỗi giây sẽ đẩy thanh cuộn về đầu
  nkChuKy = ky;

  const d = $("nk");
  d.innerHTML = "";
  if (!S.nhatKy.length) {
    d.innerHTML = `<p class="cc-ghi" style="margin:0">Chưa có gì xảy ra.</p>`;
    return;
  }
  for (const n of S.nhatKy) {
    const r = document.createElement("div");
    r.className = "nk-d";
    const cls = n.huong > 0 ? "nk-tot" : n.huong < 0 ? "nk-xau" : "";
    r.innerHTML =
      `<span class="nk-ngay num">L${n.lop}·N${n.ngay}</span>` +
      `<span class="${cls}">${n.chu}</span>`;
    d.appendChild(r);
  }
}

/* ---------- Thao tác ---------- */
function chayHanhDong(id) {
  const kq = Engine.lamHanhDong(S, noiHienTai, id, monChon, Date.now());
  if (!kq.ok) { toast(kq.loi, "xau"); return; }
  nhatKy(kq.ghi, 0);
  Luu.ghi(S);

  if (kq.sangNgay) {
    noiHienTai = Engine.phaNgay(S.ngay).thi ? "truong" : noiHienTai;
    veNoiBar();
    toast(kq.ghi);
  }
  nhip();
}

/* ---------- Phòng thi: người chơi trả lời câu hỏi thật ---------- */
let BaiThi = null;   // { loai, de:[{mon,cau}], i, dapAn:{}, troGiup:{}, daChon }

function vaoThi(loai) {
  const soCau = loai === "gk" ? Engine.CAU_GIUA_KY : Engine.CAU_CUOI_NAM;
  const de = [];
  for (const m of Engine.MON) {
    if (!m.quiz) continue;
    for (const c of Engine.layDe(S.lop, m.id, soCau)) de.push({ mon: m, cau: c });
  }
  if (!de.length) { chotThi(loai, null); return; }

  BaiThi = {
    loai, de, i: 0, daChon: null, boBot: null,
    dapAn: Object.fromEntries(Engine.MON.filter(m => m.quiz).map(m => [m.id, { dung: 0, tong: 0 }])),
    troGiup: Object.fromEntries(Engine.MON.filter(m => m.quiz).map(m => [m.id, Engine.soTroGiup(S, m.id)])),
  };
  veCauHoi();
}

function veCauHoi() {
  const B = BaiThi;
  const q = B.de[B.i];
  const tg = B.troGiup[q.mon.id];
  const daTraLoi = B.daChon !== null;

  const dapAn = q.cau.d.map((t, j) => {
    if (B.boBot && B.boBot.includes(j)) {
      return `<button class="lc" disabled style="opacity:.25">${t}</button>`;
    }
    let style = "";
    if (daTraLoi) {
      if (j === q.cau.iDung) style = "border-color:var(--bang-xanh);background:var(--bang-bg);color:var(--bang-xanh)";
      else if (j === B.daChon) style = "border-color:var(--but-do);background:var(--but-do-bg);color:var(--but-do)";
    }
    return `<button class="lc" data-j="${j}" ${daTraLoi ? "disabled" : ""} style="${style}">${t}</button>`;
  }).join("");

  const dung = daTraLoi && B.daChon === q.cau.iDung;
  const phanHoi = daTraLoi
    ? `<p class="phe" style="color:${dung ? "var(--bang-xanh)" : "var(--but-do)"};border-color:${dung ? "var(--bang-xanh)" : "var(--but-do)"}">
         ${dung ? "Đúng rồi!" : "Chưa đúng. Đáp án là “" + q.cau.d[q.cau.iDung] + "”."}</p>
       <div style="margin-top:14px"><button class="nut-chinh" id="btTiep">
         ${B.i + 1 < B.de.length ? "Câu tiếp theo" : "Nộp bài"}</button></div>`
    : (tg > 0 && !B.boBot
        ? `<div style="margin-top:12px"><button class="nut-phu" id="btTro" style="width:100%">
             Bỏ bớt 2 đáp án sai — còn ${tg} lượt</button></div>`
        : (!B.boBot ? `<p class="cc-ghi">Hết lượt trợ giúp môn này. Học kỹ hơn để có thêm lượt.</p>` : ""));

  moHop(`
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px">
      <span class="cb cb-thuong">${q.mon.ten} · Lớp ${S.lop}</span>
      <span class="cc-ghi num" style="margin:0">Câu ${B.i + 1}/${B.de.length}</span>
    </div>
    <h3 style="margin:10px 0 16px">${q.cau.h}</h3>
    <div class="lc-list">${dapAn}</div>
    ${phanHoi}
  `, "thi");

  if (!daTraLoi) {
    for (const b of document.querySelectorAll(".lc[data-j]")) {
      b.onclick = () => traLoi(Number(b.dataset.j));
    }
    const bt = document.getElementById("btTro");
    if (bt) bt.onclick = () => {
      B.troGiup[q.mon.id] -= 1;
      const sai = q.cau.d.map((_, j) => j).filter(j => j !== q.cau.iDung);
      B.boBot = xaoMang(sai).slice(0, 2);
      veCauHoi();
    };
  } else {
    document.getElementById("btTiep").onclick = cauTiep;
  }
}

function xaoMang(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function traLoi(j) {
  const B = BaiThi;
  const q = B.de[B.i];
  B.daChon = j;
  B.dapAn[q.mon.id].tong += 1;
  if (j === q.cau.iDung) B.dapAn[q.mon.id].dung += 1;
  veCauHoi();
}

function cauTiep() {
  const B = BaiThi;
  B.i += 1; B.daChon = null; B.boBot = null;
  if (B.i < B.de.length) { veCauHoi(); return; }
  const lamBai = B.dapAn, loai = B.loai;
  BaiThi = null;
  chotThi(loai, lamBai);
}

function chotThi(loai, lamBai) {
  if (loai === "gk") {
    const r = Engine.thiGiuaKy(S, lamBai, Math.random);
    Luu.ghi(S);
    const hang = r.kq.map(hangDiem).join("");
    const phe = r.yeu.length
      ? `<p class="phe">Còn ${r.yeu.map(y => y.ten).join(", ")} chưa đạt. Cố lên con.</p>`
      : `<p class="phe">Giữ được đà này là tốt lắm.</p>`;
    nhatKy(`Kiểm tra giữa kỳ xong`, r.yeu.length ? -1 : 1);
    moHop(`
      <h3>Kiểm tra giữa kỳ</h3>
      <p class="hop-mo">Điểm kiểm tra đã kéo điểm từng môn lên hoặc xuống.</p>
      ${hang}${phe}
      <div style="margin-top:18px"><button class="nut-chinh" id="btOk">Về lớp học tiếp</button></div>
    `, "giuaky");
    $("btOk").onclick = () => { dongHop(); Luu.ghi(S); nhip(); };
    return;
  }

  const r = Engine.thiCuoiNam(S, lamBai, Math.random);
  S.hetNam = r;
  Luu.ghi(S);
  manKetNam();
}

/* Một dòng điểm, kèm số câu đúng nếu là môn thi viết */
function hangDiem(x) {
  const mau = x.diem < 3.5 ? "var(--but-do)" : x.diem < 5 ? "#d98324" : "var(--bang-xanh)";
  const phu = x.quiz
    ? `<div class="hd-mo num">Đúng ${x.dung}/${x.tong} câu</div>`
    : `<div class="hd-mo">Chấm theo thể lực</div>`;
  return `<div class="mon-row"><div class="mon-ten">${x.ten}</div>` +
         `<div class="mon-diem num" style="color:${mau}">${soLam(x.diem)}</div>${phu}</div>`;
}

function manKetNam() {
  const r = S.hetNam;
  if (!r) return;
  if (hopHienTai === "ketnam") return;   // đã hiện rồi thì đừng vẽ lại mỗi giây
  const hang = r.kq.map(hangDiem).join("");

  const dat = r.dat;
  const phe = dat
    ? (r.tb >= 8 ? "Con học giỏi lắm, cô rất mừng." : "Đạt rồi. Sang năm cố thêm nữa nhé.")
    : (r.liet.length ? `Môn ${r.liet.map(l => l.ten).join(", ")} điểm liệt. Phải học lại thôi con.`
                     : "Trung bình chưa đủ 5,0. Năm nay chưa lên lớp được.");

  const nut = r.choThiLai
    ? `<button class="nut-chinh" id="btLai">Xin thi lại trong hè</button>
       <div style="margin-top:9px"><button class="nut-phu" id="btNhan" style="width:100%">Chấp nhận kết quả</button></div>`
    : `<button class="nut-chinh" id="btNhan">${dat ? `Lên lớp ${S.lop + 1}` : "Ở lại lớp " + S.lop}</button>`;

  moHop(`
    <h3>Thi cuối năm — Lớp ${S.lop}</h3>
    ${hang}
    <div class="the-ket">
      <div class="ket-diem num ${dat ? "ket-dat" : "ket-truot"}">${soLam(r.tb)}</div>
      <div style="font-weight:800;margin-top:6px;color:${dat ? "var(--bang-xanh)" : "var(--but-do)"}">
        ${dat ? "ĐẠT — LÊN LỚP" : "CHƯA ĐẠT"}
      </div>
    </div>
    <p class="phe">${phe}</p>
    <div style="margin-top:18px">${nut}</div>
  `, "ketnam");

  if (r.choThiLai) {
    $("btLai").onclick = () => {
      S.daThiLai = true;
      S.tamTrang = Math.max(0, S.tamTrang - 10);
      for (const m of Engine.MON) S.diem[m.id] += 0.5;   // ôn hè kéo nền lên
      S.hetNam = null;
      nhatKy("Thi lại trong hè", 0);
      Luu.ghi(S);
      dongHop();
      vaoThi("ck");      // làm lại đề mới, không phải tung xúc xắc
    };
  }
  $("btNhan").onclick = () => {
    const kq = Engine.apDungKetQua(S, r, Date.now());
    nhatKy(kq.lenLop ? `Lên lớp ${S.lop}` : `Lưu ban lớp ${S.lop}`, kq.lenLop ? 1 : -1);
    Luu.ghi(S);
    dongHop();
    if (S.ketThuc) { manHetNoiDung(); return; }
    toast(kq.lenLop ? `Lên lớp ${S.lop}!` : `Phải học lại lớp ${S.lop}`, kq.lenLop ? "tot" : "xau");
    nhip();
  };
}

function manSuKien() {
  const sk = Engine.timSuKien(S.choSuKien);
  if (!sk) { S.choSuKien = null; return; }
  if (hopHienTai === "sukien") return;   // đã hiện rồi thì đừng vẽ lại mỗi giây

  const lc = sk.lc.map((c, i) => {
    const mo = c.dk ? !c.dk(S) : false;
    return `<button class="lc" data-i="${i}" ${mo ? "disabled" : ""}>${c.t}` +
           (mo && c.khoa ? `<span class="lc-khoa">${c.khoa}</span>` : "") + `</button>`;
  }).join("");

  moHop(`
    <h3>${sk.ten}</h3>
    <p class="hop-mo">${sk.mo}</p>
    <div class="lc-list">${lc}</div>
  `, "sukien");

  for (const b of document.querySelectorAll(".lc")) {
    b.onclick = () => {
      const kq = Engine.chonSuKien(S, sk.id, Number(b.dataset.i));
      if (!kq.ok) { toast(kq.loi, "xau"); return; }
      nhatKy(kq.ghi, kq.tot);
      Luu.ghi(S);
      dongHop();
      nhip();
    };
  }
}

function manHetNoiDung() {
  moHop(`
    <h3>Hết nội dung bản thử nghiệm</h3>
    <p class="hop-mo">${S.ten} đã học xong lớp ${Engine.LOP_CUOI - 1}. Bản v0.1 dừng ở đây.</p>
    <div class="mon-row"><div class="mon-ten">Tuổi khi kết thúc</div><div class="mon-diem num" style="font-size:22px">${tuoiChu(S)}</div></div>
    <div class="mon-row"><div class="mon-ten">Số lần lưu ban</div><div class="mon-diem num" style="font-size:22px">${S.soLuuBan}</div></div>
    <div class="mon-row"><div class="mon-ten">Trí tuệ</div><div class="mon-diem num" style="font-size:22px">${soNguyen(S.triTue)}</div></div>
    <p class="phe">${S.soLuuBan === 0 ? "Đi đúng tuổi, không trượt năm nào." : `Chậm mất ${S.soLuuBan} năm so với bạn cùng lứa.`}</p>
    <div style="margin-top:18px"><button class="nut-chinh" id="btMoi">Chơi lại từ đầu</button></div>
  `, "hetnoidung");
  $("btMoi").onclick = () => { Luu.xoa(); S = null; dongHop(); manTao(); };
}

/* ---------- Bảng công cụ ---------- */
$("swNhanh").onchange = e => {
  if (!S) return;
  Engine.tick(S, Date.now());
  S.nhanh = e.target.checked;
  S.moc = Date.now();
  S.mocAp = Date.now();
  Luu.ghi(S);
  toast(S.nhanh ? "Đã bật tua nhanh" : "Về nhịp thật");
  nhip();
};
$("ccAp").onclick    = () => { if (!S) return; S.ap = S.apMax; S.mocAp = Date.now(); Luu.ghi(S); nhip(); toast("Đã nạp đầy"); };
$("ccSk").onclick    = () => { if (!S) return; S.sucKhoe = 100; S.tamTrang = 100; Luu.ghi(S); nhip(); toast("Đã hồi phục"); };
$("ccNgay").onclick  = () => {
  if (!S) return;
  if (Engine.phaNgay(S.ngay).thi) { toast("Đang là ngày thi — phải thi xong.", "xau"); return; }
  S.ap = 0;
  const kq = Engine.nguDay(S, Date.now());
  if (!kq.ok) { toast(kq.loi, "xau"); return; }
  nhatKy(kq.ghi, 0); Luu.ghi(S);
  noiHienTai = Engine.phaNgay(S.ngay).thi ? "truong" : noiHienTai;
  veNoiBar(); nhip();
};
$("ccXoa").onclick = () => {
  moHop(`
    <h3>Xoá toàn bộ tiến trình?</h3>
    <p class="hop-mo">Nhân vật hiện tại sẽ mất hẳn. Không khôi phục được.</p>
    <div class="lc-list">
      <button class="lc" id="btXoaOk" style="border-color:var(--but-do);color:var(--but-do)">Xoá và tạo nhân vật mới</button>
      <button class="lc" id="btXoaHuy">Giữ lại</button>
    </div>
  `, "xacnhanxoa");
  $("btXoaOk").onclick = () => { Luu.xoa(); S = null; if (heNhip) clearInterval(heNhip); dongHop(); manTao(); };
  $("btXoaHuy").onclick = dongHop;
};

/* ---------- Khởi động ---------- */
function khoiDong(dulieu) {
  const cu = (dulieu && dulieu.S) || Luu.doc();
  if (!luuDuocKhong()) {
    toast("Trình duyệt chặn lưu — tiến trình sẽ mất khi tải lại.", "xau");
  }
  if (cu) {
    S = cu;
    S.moc = S.moc || Date.now();
    S.mocAp = S.mocAp || Date.now();
    batDauChoi();
  } else {
    manTao();
  }
}

function luuDuocKhong() {
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; }
  catch { luuDuoc = false; return false; }
}

if (window.claude && window.claude.hot) {
  window.claude.hot.snapshot(() => ({ S, noiHienTai, monChon }));
}
const boot = d => {
  if (d && d.noiHienTai) noiHienTai = d.noiHienTai;
  if (d && d.monChon) monChon = d.monChon;
  khoiDong(d);
};
if (window.claude && window.claude.hot && window.claude.hot.ready) {
  window.claude.hot.ready(boot);
} else {
  boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
}
</script>
